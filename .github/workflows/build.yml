name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Check UI helpers and preferences
        run: dotnet run --project development/FoxBridge.WinUI.Checks/FoxBridge.WinUI.Checks.csproj
      - name: Check stdio backend
        run: python development/FoxBridge.WinUI/Backend/test_worker.py -v
      - name: Check proxy engine and terminal setup
        working-directory: development/FoxBridge-source
        run: python -m unittest test_bridge test_netcoffee test_reliability test_launcher -v
      - name: Publish Release
        shell: pwsh
        run: ./development/Publish-Release.ps1
      - name: Package application
        shell: pwsh
        run: |
          [xml]$project = Get-Content development/FoxBridge.WinUI/FoxBridge.WinUI.csproj
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match the project version v$version"
          }
          ./development/Package-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: foxbridge-windows-x64
          path: development/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: foxbridge-windows-x64
          path: development/release-artifacts
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./development/Publish-GitHubRelease.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME
